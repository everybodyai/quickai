# ILLUSTRATIVE. The shared nouns that engines, recipes and the UI refer to by id.
# Modalities, adapter kinds (what a recipe calls "components") and API definitions. This is data-tier:
# it can name things and describe them, it cannot launch anything or reach any host.
schema = 1
kind = "vocab"
id = "core"

# ---- modalities ----------------------------------------------------------------------------------------
[[modality]]
id = "text"
label = "Text"

[[modality]]
id = "image"
label = "Images"

[[modality]]
id = "audio"
label = "Audio"

[[modality]]
id = "video"
label = "Video"

# ---- adapter kinds: extra artifacts attached to a model at run time -------------------------------------
# A kind says what the user sees (label, help, fields) and what the artifact is (formats, how to spot one).
# How a particular engine attaches it (flags, env, files, calls) lives in that engine's document.
[[adapter_kind]]
id = "mmproj"
label = "Vision / audio / video projector"
help = "Lets a text model take images, audio or video as input. It must come from the same model family as the base model."
cardinality = "0..1"
formats = ["gguf"]
adds_input = ["image", "audio", "video"]        # a recipe narrows this to what its projector really supports
discover = { glob = ["mmproj*.gguf", "*mmproj*.gguf"] }      # llama.cpp's own convention: the file name starts with "mmproj"
fields = [
  { id = "offload", label = "Offload projector to GPU", type = "bool", default = true },
  { id = "image_min_tokens", label = "Minimum tokens per image", type = "int", optional = true, advanced = true },
  { id = "image_max_tokens", label = "Maximum tokens per image", type = "int", optional = true, advanced = true },
]

[[adapter_kind]]
id = "lora"
label = "LoRA adapter"
help = "A small fine-tune applied on top of the base model."
cardinality = "0..n"
formats = ["gguf"]
fields = [
  { id = "scale", label = "Scale", type = "float", range = [0.0, 2.0], step = 0.05, default = 1.0 },
]

[[adapter_kind]]
id = "draft"
label = "Draft model"
help = "A small model that proposes tokens for the main model to check (speculative decoding)."
cardinality = "0..1"
formats = ["gguf"]
fields = [
  { id = "n_max", label = "Tokens to draft", type = "int", range = [1, 64], default = 3 },
  { id = "gpu_layers", label = "Draft GPU layers", type = "int", range = [0, 999], optional = true, advanced = true },
]

# ---- what a look-up sorts what it found into ---------------------------------------------------------------
# The section a model is shown in, and the bands the size filter has (docs/lookup-and-bundles.md, section 3).
# A model is of the first type, in the order written, whose `match` holds, else of the `default` one; the
# sections stand in the order of `order`. Both are the same for every engine, so what a model is does not
# depend on where it was found. A document of the person's patches one by `id` or adds another (a new type
# is tried after these).
#
# `match` is a list of what a source says (a capability of an Ollama card, the pipeline tag and tags of a
# Hugging Face repository), words of the model's name (a word of four letters or more also matches the start
# of one: `embed` is in `embeddinggemma`) and the kinds of companion file found beside it (`mmproj`).

[[model_type]]
id = "embedding"
label = "Embedding"
order = 40
help = "Turns text into numbers for search and retrieval. It does not chat."
match = { capabilities = ["embedding"], pipelines = ["feature-extraction", "sentence-similarity", "text-ranking"], words = ["embed", "bge", "gte", "e5", "minilm", "rerank", "reranker"] }

[[model_type]]
id = "audio"
label = "Audio"
order = 50
help = "Listens or speaks: speech to text, text to speech."
match = { capabilities = ["audio"], pipelines = ["automatic-speech-recognition", "text-to-speech", "text-to-audio", "audio-to-audio", "audio-classification", "voice-activity-detection"], words = ["whisper", "tts", "asr", "speech", "parakeet"] }

[[model_type]]
id = "vision"
label = "Vision"
order = 30
help = "Reads pictures as well as text; most need a second file, their projector."
match = { capabilities = ["vision"], pipelines = ["image-text-to-text", "image-to-text", "visual-question-answering", "document-question-answering", "video-text-to-text"], companions = ["mmproj"], words = ["vl", "vision", "llava", "pixtral", "minicpm"] }

[[model_type]]
id = "code"
label = "Code"
order = 20
help = "Tuned for programming."
match = { words = ["code", "starcoder", "devstral", "deepcoder", "opencoder"], tags = ["code"] }

[[model_type]]
id = "other"
label = "Other"
order = 90
help = "Not language models, or kinds this engine does not run."
match = { pipelines = ["object-detection", "image-segmentation", "image-classification", "image-feature-extraction", "depth-estimation", "zero-shot-object-detection", "zero-shot-image-classification", "mask-generation", "keypoint-detection", "text-to-image", "image-to-image", "unconditional-image-generation", "text-to-video", "image-to-video", "image-text-to-video", "video-classification", "tabular-classification", "reinforcement-learning", "robotics"] }

[[model_type]]
id = "chat"
label = "Chat"
order = 10
default = true
help = "Answers in conversation, and everything that does not say it is something else."

[[size_class]]
id = "small"
label = "Small (< 4 GB)"
help = "Runs on most machines."
below = "4GiB"

[[size_class]]
id = "medium"
label = "Medium (4-15 GB)"
help = "Wants a machine with 16 GB of memory or a good graphics card."
below = "15GiB"

[[size_class]]
id = "large"
label = "Large (15 GB+)"
help = "Wants a lot of memory."

# ---- APIs: what a client can call, and how the proxy reads it ------------------------------------------
# `decode` drives the Live tab: framing, and JSON pointers to the text of a request and of a reply
# (`error` says where the engine reports what went wrong). Relaying is never affected. The embedded
# copy (crates/quickai/manifests/vocab/core.toml) has the same APIs; `adapter_kind` and the curl examples
# join it when the interface uses them.
[[api]]
id = "openai.chat"
paths = ["/v1/chat/completions", "/chat/completions"]
capabilities = ["chat"]

[api.decode]
framing = ["sse", "json"]
delta = ["/choices/0/delta/content"]
final = ["/choices/0/message/content"]
error = ["/error"]

[api.decode.chat]
messages = "/messages"
role = "/role"
content = "/content"
skip_roles = ["system"]
parts = { type = "/type", text = "/text" }

[[api.examples]]
label = "Text"
when = "true"
curl = '''
curl ${api.base_url}/chat/completions \
  -H "Content-Type: application/json" \
  -d '{"model":"${api.model}","messages":[{"role":"user","content":"Hello"}]}'
'''

[[api.examples]]
label = "Image"
when = "has(model.modalities.input, 'image')"
curl = '''
curl ${api.base_url}/chat/completions \
  -H "Content-Type: application/json" \
  -d '{"model":"${api.model}","messages":[{"role":"user","content":[{"type":"text","text":"What is in this picture?"},{"type":"image_url","image_url":{"url":"data:image/png;base64,<BASE64>"}}]}]}'
'''

[[api]]
id = "openai.completions"
paths = ["/v1/completions", "/completions"]
capabilities = ["completion"]

[api.decode]
framing = ["sse", "json"]
prompt = "/prompt"
delta = ["/choices/0/text"]
final = ["/choices/0/text"]
error = ["/error"]

[[api]]
id = "openai.embeddings"
paths = ["/v1/embeddings"]
capabilities = ["embedding"]

[[api]]
id = "llamacpp.completion"
paths = ["/completion"]
capabilities = ["completion"]

[api.decode]
framing = ["sse", "json"]
prompt = "/prompt"
delta = ["/content"]
final = ["/content"]
error = ["/error"]

[[api]]
id = "ollama.chat"
paths = ["/api/chat"]
capabilities = ["chat"]

[api.decode]
framing = ["ndjson", "json"]
delta = ["/message/content"]
final = ["/message/content"]
error = ["/error"]

[api.decode.chat]
messages = "/messages"
role = "/role"
content = "/content"
skip_roles = ["system"]
images = "/images"              # base64 images in a message become attachments in the Live tab

[[api]]
id = "ollama.generate"
paths = ["/api/generate"]
capabilities = ["completion"]

[api.decode]
framing = ["ndjson", "json"]
prompt = "/prompt"
delta = ["/response"]
final = ["/response"]
error = ["/error"]
