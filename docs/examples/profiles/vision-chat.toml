# A configuration: what QuickAI runs and how, in a file that can be chosen, saved and given to someone else
# (docs/configurations.md; every key is on docs/reference/profile-fields.md). This one is Ollama with a vision
# model, a context of 16K and Open WebUI beside it. Nothing in it says where anything is on a disk: a model is a
# name, a program is a label of a build, and a computer that lacks either is told so before anything is taken.
# It is data: it can pick what the application already knows and name no program, host or address to fetch from.
schema = 1
kind = "profile"
id = "vision-chat"
requires = { app = ">=0.1" }
name = "Vision chat"
engine = "ollama"

[meta]
note = "Qwen3-VL 8B on Ollama, 16K context, with Open WebUI beside it."
made_with = "QuickAI 0.1.0"
made_on = { os = "linux", arch = "x86_64", gpu = ["amd"], memory_gb = 32 }

[runtime]
build = "v0.40.0"

[[model]]
role = "main"
ollama = "qwen3-vl:8b"                  # the key is the kind of name the engine takes (`accepts.refs`)
size = 6140000000

# Only what differs from the default is written. A text that becomes an environment line (or a command-line word) is
# shown in full to whoever opens the file, and taken only if they agree.
[values.ollama]
ctx_size = 16384
extra_env = "OLLAMA_FLASH_ATTENTION=1"

[values.openwebui]                      # a companion's settings are a table of its own
enabled = true
port = 3000
