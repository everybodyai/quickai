name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt

      # Each failing test as an annotation of the run, with the start of what it printed: annotations are
      # shown on the run's page and read by the API without the log.
      - name: Name the tests that failed
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          awk '
            function flush() {
              if (name != "") { gsub(/:/, "%3A", name); printf "::error title=%s::%s\n", name, msg }
              name = ""
            }
            { sub(/\r$/, "") }
            /^---- .* stdout ----$/ { flush(); name = $2; msg = ""; lines = 0; next }
            name != "" && (/^failures:$/ || /^---- /) { flush() }
            name != "" && lines < 15 && $0 != "" { line = $0; gsub(/%/, "%25", line); msg = msg (lines ? "%0A" : "") line; lines++ }
            END { flush() }
          ' test-output.txt

      - name: Check the embedded configuration
        run: cargo run -p quickai -- config check --strict --embedded

      - name: Build (release)
        run: cargo build --release -p quickai
