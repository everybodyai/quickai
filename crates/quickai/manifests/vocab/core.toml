# The shared nouns that engines and the interface refer to by id: the kinds of input and output a
# model can have, the types of model and the classes of size a look-up sorts by, and the APIs an
# engine can serve, with how the live-traffic proxy reads each one (docs/examples/vocab/core.toml is
# the fuller design, with the adapter kinds of Phase 4; they join this file when the interface uses
# them).
#
# `decode` drives the Live tab: how a reply comes (`framing`), and JSON pointers to the text of a
# request (`prompt`, or the `chat` table) and of a reply (`delta` for each event of a stream,
# `final` for a reply that comes whole, `error`). The proxy relays every byte as it is whatever
# this says; a shape nothing here describes is a blank entry in the Live tab, never a failure.
schema = 1
kind = "vocab"
id = "core"
requires = { primitives = ["decode@1"] }

[[modality]]
id = "text"
label = "Text"

[[modality]]
id = "image"
label = "Images"

[[modality]]
id = "audio"
label = "Audio"

[[modality]]
id = "video"
label = "Video"

# ---- what a look-up sorts what it found into ---------------------------------------------------------------
# The section a model is shown in, and the bands the size filter has (docs/lookup-and-bundles.md, section 3).
# A model is of the first type, in the order written, whose `match` holds, else of the `default` one; the
# sections stand in the order of `order`. Both are the same for every engine, so what a model is does not
# depend on where it was found. A document of the person's patches one by `id` or adds another (a new type
# is tried after these).
#
# `match` is a list of what a source says (a capability of an Ollama card, the pipeline tag and tags of a
# Hugging Face repository), words of the model's name (a word of four letters or more also matches the start
# of one: `embed` is in `embeddinggemma`) and the kinds of companion file found beside it (`mmproj`).

[[model_type]]
id = "embedding"
label = "Embedding"
order = 40
help = "Turns text into numbers for search and retrieval. It does not chat."
match = { capabilities = ["embedding"], pipelines = ["feature-extraction", "sentence-similarity", "text-ranking"], words = ["embed", "bge", "gte", "e5", "minilm", "rerank", "reranker"] }

[[model_type]]
id = "audio"
label = "Audio"
order = 50
help = "Listens or speaks: speech to text, text to speech."
match = { capabilities = ["audio"], pipelines = ["automatic-speech-recognition", "text-to-speech", "text-to-audio", "audio-to-audio", "audio-classification", "voice-activity-detection"], words = ["whisper", "tts", "asr", "speech", "parakeet"] }

[[model_type]]
id = "documents"
label = "Documents"
order = 35
help = "Reads scans, forms and photographs of pages and gives back their text."
match = { words = ["ocr", "docling"] }

[[model_type]]
id = "vision"
label = "Vision"
order = 30
help = "Reads pictures as well as text; most need a second file, their projector."
match = { capabilities = ["vision"], pipelines = ["image-text-to-text", "image-to-text", "visual-question-answering", "document-question-answering", "video-text-to-text"], companions = ["mmproj"], words = ["vl", "vision", "llava", "pixtral", "minicpm"] }

[[model_type]]
id = "code"
label = "Code"
order = 20
help = "Tuned for programming."
match = { words = ["code", "starcoder", "devstral", "deepcoder", "opencoder"], tags = ["code"] }

[[model_type]]
id = "reasoning"
label = "Reasoning"
order = 15
help = "Thinks step by step before it answers: slower, and better at logic, maths and planning."
match = { words = ["reasoning", "thinking", "r1", "qwq", "reasoner"] }

[[model_type]]
id = "translation"
label = "Translation"
order = 25
help = "Translates between languages."
match = { pipelines = ["translation"], words = ["translat", "madlad"] }

[[model_type]]
id = "video"
label = "Video"
order = 60
help = "Makes short video clips from a prompt or a picture. It does not chat."
match = { pipelines = ["text-to-video", "image-to-video", "image-text-to-video", "video-to-video"] }

# Pictures and what reads a prompt for a picture or a video are what an engine like ComfyUI runs; an engine
# that does not (llama.cpp, Ollama) lists them under `other`, as it always did.
[[model_type]]
id = "image"
label = "Images"
order = 62
help = "Makes pictures from a prompt or from another picture. It does not chat."
match = { pipelines = ["text-to-image", "image-to-image", "unconditional-image-generation"] }

[[model_type]]
id = "text_encoder"
label = "Text encoders"
order = 65
help = "Reads the prompt for a picture or video model: a workflow names one beside the model. It is fetched on its own, and kept where the engine looks for it."
match = { companions = ["text_encoder"] }

[[model_type]]
id = "other"
label = "Other"
order = 90
help = "Not language models, or kinds this engine does not run."
match = { pipelines = ["object-detection", "image-segmentation", "image-classification", "image-feature-extraction", "depth-estimation", "zero-shot-object-detection", "zero-shot-image-classification", "mask-generation", "keypoint-detection", "video-classification", "tabular-classification", "reinforcement-learning", "robotics"] }

[[model_type]]
id = "chat"
label = "Chat"
order = 10
default = true
help = "Answers in conversation, and everything that does not say it is something else."

[[size_class]]
id = "small"
label = "Small (< 4 GB)"
help = "Runs on most machines."
below = "4GiB"

[[size_class]]
id = "medium"
label = "Medium (4-15 GB)"
help = "Wants a machine with 16 GB of memory or a good graphics card."
below = "15GiB"

[[size_class]]
id = "large"
label = "Large (15 GB+)"
help = "Wants a lot of memory."

# ---- OpenAI's shapes, which both engines serve --------------------------------------------------------
[[api]]
id = "openai.chat"
paths = ["/v1/chat/completions", "/chat/completions"]
capabilities = ["chat"]

[api.decode]
framing = ["sse", "json"]
delta = ["/choices/0/delta/content"]
final = ["/choices/0/message/content"]
error = ["/error"]

[api.decode.chat]
messages = "/messages"
role = "/role"
content = "/content"
skip_roles = ["system"]
parts = { type = "/type", text = "/text" }

# What the API panel shows: the first example whose `when` holds, with this engine's address and the
# name of the model (`${api.base_url}`, `${api.model}`). The image one waits for models that take
# pictures (Phase 4); every model has text input today.
[[api.examples]]
label = "Text"
when = "true"
curl = '''
curl ${api.base_url}/chat/completions \
  -H "Content-Type: application/json" \
  -d '{"model":"${api.model}","messages":[{"role":"user","content":"Hello"}]}'
'''

[[api.examples]]
label = "Image"
when = "has(model.modalities.input, 'image')"
curl = '''
curl ${api.base_url}/chat/completions \
  -H "Content-Type: application/json" \
  -d '{"model":"${api.model}","messages":[{"role":"user","content":[{"type":"text","text":"What is in this picture?"},{"type":"image_url","image_url":{"url":"data:image/png;base64,<BASE64>"}}]}]}'
'''

[[api]]
id = "openai.completions"
paths = ["/v1/completions", "/completions"]
capabilities = ["completion"]

[api.decode]
framing = ["sse", "json"]
prompt = "/prompt"
delta = ["/choices/0/text"]
final = ["/choices/0/text"]
error = ["/error"]

[[api]]
id = "openai.embeddings"
paths = ["/v1/embeddings"]
capabilities = ["embedding"]

# ---- llama.cpp's own ------------------------------------------------------------------------------------
[[api]]
id = "llamacpp.completion"
paths = ["/completion"]
capabilities = ["completion"]

[api.decode]
framing = ["sse", "json"]
prompt = "/prompt"
delta = ["/content"]
final = ["/content"]
error = ["/error"]

# ---- Ollama's own -----------------------------------------------------------------------------------------
# A reply streams as one JSON object per line (`application/x-ndjson`) unless the request says
# `"stream": false`. A request with no prompt (or no messages) is a load or an unload: it goes
# through the same path and is not a conversation, so the Live tab does not show it.
[[api]]
id = "ollama.chat"
paths = ["/api/chat"]
capabilities = ["chat"]

[api.decode]
framing = ["ndjson", "json"]
delta = ["/message/content"]
final = ["/message/content"]
error = ["/error"]

[api.decode.chat]
messages = "/messages"
role = "/role"
content = "/content"
skip_roles = ["system"]
images = "/images"              # base64 images in a message are listed as attachments

[[api]]
id = "ollama.generate"
paths = ["/api/generate"]
capabilities = ["completion"]

[api.decode]
framing = ["ndjson", "json"]
prompt = "/prompt"
delta = ["/response"]
final = ["/response"]
error = ["/error"]

# ---- ComfyUI's own ----------------------------------------------------------------------------------------
# A workflow is not a conversation: a client sends the graph of nodes it wants run to /prompt and asks
# /history what came out, so there is nothing for the Live tab to read, and the API panel says how it is
# done.
[[api]]
id = "comfyui.workflow"
paths = ["/prompt"]
capabilities = ["workflow"]

[[api.examples]]
label = "Workflow"
when = "true"
curl = '''
# 1. In ComfyUI's page, build a workflow and save it with Export (API).
# 2. Queue it (this prints the id of the job):
curl ${api.base_url}/prompt \
  -H "Content-Type: application/json" \
  -d "{\"prompt\": $(cat workflow_api.json)}"
# 3. Ask what it made (the files are named in the answer; /view?filename=... fetches one):
curl ${api.base_url}/history
'''
