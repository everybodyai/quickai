[package]
name = "quickai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QuickAI's window: the part of the application a person looks at. Everything it does to the computer is the runtime crate's."

[[bin]]
name = "quickai"
path = "src/main.rs"

[dependencies]
quickai-core = { path = "../quickai-core" }
quickai-runtime = { path = "../quickai-runtime" }
crossbeam-channel = "0.5.16"
directories = "6"
eframe = "=0.36.1"
egui = "=0.36.1"
rfd = "0.17.2"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
webbrowser = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# the fakes and the golden files the runtime's own tests use
quickai-runtime = { path = "../quickai-runtime", features = ["testkit"] }

[build-dependencies]
winresource = "0.1.31"
