[package]
name = "quickai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QuickAI's window: the part of the application a person looks at. Everything it does to the computer is the runtime crate's."

[[bin]]
name = "quickai"
path = "src/main.rs"

[dependencies]
quickai-core = { path = "../quickai-core" }
quickai-runtime = { path = "../quickai-runtime", default-features = false }
crossbeam-channel = "0.5.16"
directories = "6"
eframe = "=0.36.1"
egui = "=0.36.1"
rfd = "0.17.2"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
webbrowser = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["remote-setup"]
# Runs QuickAI sets up on another computer (WP4.33, docs/remote-runs.md section 5): the way "QuickAI sets it up" of a
# computer, the page of its run, its dialogs. Without it (`--no-default-features`) the window has the computers it
# attaches to only; `app/remote_run_off.rs` stands in for what is left out.
remote-setup = ["quickai-runtime/remote-setup"]

[dev-dependencies]
# the fakes and the golden files the runtime's own tests use
quickai-runtime = { path = "../quickai-runtime", features = ["testkit"] }

[build-dependencies]
winresource = "0.1.31"
