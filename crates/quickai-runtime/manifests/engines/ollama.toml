# Ollama as data, with one piece of Rust that is about Ollama's website and not its program: the reading of
# the library's search page (`lookup.ollama_library@1`), because the library has no list a program can read.
# This is the document the application ships
# (crates/quickai-runtime/manifests/engines/ollama.toml has the same content, and a test keeps them equal), and
# a document of the same id in the user's configuration directory patches it.
#
# Facts behind it: docs/engine-facts.md (O1 to O10, A1 to A17). Compare with llamacpp.toml: the same
# sections, different values. The only differences are in the data: an installed build is a bin/ + lib/
# tree, the server is a daemon (attach or spawn), the model is loaded by a warm-up call, and models are
# named references listed and pulled over HTTP. The context size has no default (O12), the daemon is
# identified before it is attached to, the fields are locked while a session runs, and what is typed
# into the model box is the tested set of rules (docs/phase3-test-plan.md, group M).
schema = 1
kind = "engine"
id = "ollama"
requires = { primitives = ["locate.setting@1", "locate.installed@1", "locate.path_search@1", "locate.known_paths@1", "exec.probe@1", "feed.github_release@1", "install.archive@1", "spawn@1", "attach@1", "probe.http@1", "http_call@1", "decode@1", "lookup.ollama_library@1"] }

[engine]
name = "Ollama"
server_name = "Ollama"
summary = "A daemon that loads models on demand."
license = "MIT"
bundled = false                 # downloaded on request, never shipped in a package
homepage = "https://ollama.com"
order = 20
egress = ["registry.ollama.ai", "hf.co", "*.cdn.hf.co"]    # contacted by the daemon itself when a model is pulled; measured (O21): registry.ollama.ai for a 46 MB and a 271 MB model, hf.co and us.aws.cdn.hf.co for an hf.co/ reference. A name that begins `*.` stands for every host under it

[provides]
apis = ["openai.chat", "openai.completions", "openai.embeddings", "ollama.chat", "ollama.generate"]
# no `web_ui`: `ollama serve` has no chat page, so there is no "Open Chat UI"
accepts = { formats = [], refs = ["ollama"] }       # models are named references, not files
model_name_matters = true       # a request naming another model loads (and with MAX_LOADED_MODELS=1 evicts) ours
default_port = 11434

[runtime]
version = { exec = ["${binary}", "--version"], regex = 'version is (\S+)', as = "version" }     # reads both forms the real one prints (A17)

[locate]
strategies = [
  { use = "setting", field = "bin_override" },
  { use = "installed", root = "${data}/ollama", pick = "newest", binary = { linux = "bin/ollama", macos = "bin/ollama", windows = "ollama.exe" } },
  { use = "path_search", name = "ollama" },
  { use = "known_paths", linux = ["/usr/local/bin/ollama", "/usr/bin/ollama"], windows = ['%LOCALAPPDATA%\Programs\Ollama\ollama.exe'] },
]

[acquire]
root = "${data}/ollama"
feed = { use = "github_release", repo = "ollama/ollama", per_page = 10, show = 5, prereleases = false, digest = true }
tested = { tag = "v0.35.1" }    # offered first; the digests below are the pins
assets = { by = "names", rules = [
  { when = "os == 'linux' and arch == 'x86_64'", name = "ollama-linux-amd64.tar.zst" },
  { when = "os == 'linux' and arch == 'aarch64'", name = "ollama-linux-arm64.tar.zst" },
  { when = "os == 'windows' and arch == 'x86_64'", name = "ollama-windows-amd64.zip" },
  { when = "os == 'windows' and arch == 'aarch64'", name = "ollama-windows-arm64.zip" },
  { when = "os == 'macos'", name = "ollama-darwin.tgz" },
] }
overlays = [                    # off until chosen, never a build of their own; a platform no rule matches has none
  { id = "rocm", label = "AMD ROCm (adds about 1 GB)", rules = [
    { when = "os == 'linux' and arch == 'x86_64'", name = "ollama-linux-amd64-rocm.tar.zst" },
    { when = "os == 'windows' and arch == 'x86_64'", name = "ollama-windows-amd64-rocm.zip" },
  ] },
]
# Every install is atomic (extracted to <tag>.partial, renamed when whole), so there is no key for it. `verify`: the
# digest is checked before anything is unpacked. `smoke`: the unpacked binary must run. `skip`: Vulkan in the base
# covers AMD and Intel, and CUDA is 1.83 GB of the Windows zip's 1.94 GB, so skip it when the GPU is positively known
# not to be NVIDIA (measured with the real archive: 106 MB installed against 2.255 GB).
install = { use = "archive", binary = { name = "ollama" }, verify = "digest", smoke = ["${binary}", "--version"], skip = [ { when = "gpu.known and not has(gpu.vendors, 'nvidia')", glob = "lib/ollama/cuda_*" } ] }

[acquire.pins]                  # recorded 2026-10-06 from the GitHub API (v0.35.1)
"ollama-linux-amd64.tar.zst" = "sha256:9fcd79ac4575b2bd31b992eee18b1000c8ad126b451627c8f8cd091714cfbb10"
"ollama-linux-arm64.tar.zst" = "sha256:b1b1c85d25136b256d3740f6ecd2f7c0105e8ca71642fd6ff2fc199f3cefd69d"
"ollama-linux-amd64-rocm.tar.zst" = "sha256:786e1ba2ed7877b48aa948315ab704da2ea54a4b636e0ca18c3d328c84ff22cf"
"ollama-windows-amd64.zip" = "sha256:dc50b9ca7f9023c86525012632cd1615b093d0407987444a7f62ecab617e8e93"
"ollama-windows-arm64.zip" = "sha256:1aced40f0654eae8ef1ba07fa101be4b48225308288b0f54c5681ccf1e4199db"
"ollama-windows-amd64-rocm.zip" = "sha256:00e1d52a38479aa88954e01c969228fa98a07f433e639a6ba9fcd80b8d0993ca"
"ollama-darwin.tgz" = "sha256:3137dbf28948ee844e0fb3e584d9b5de6879d73d9f0cb7eff3ad64930601d307"

[launch]
strategies = ["attach_if_running", "spawn"]
strategy_field = "mode"         # the `mode` field (auto: both, attach: only the first, spawn: only the second) chooses

[launch.attach]
endpoint = "127.0.0.1:${public_port}"     # an engine that is already running is on the port the settings give, not on the internal one a gateway would use (C23)
identity = { path = "/api/version", pointer = "/version" }                 # a port that answers is attached to only if it answers like Ollama
liveness = { path = "/api/version", every = "5s", failures = 3 }          # no child to watch, so poll; three misses in a row are a crash

[launch.spawn]
program = "${runtime.binary}"
args = ["serve"]
env = [
  { name = "OLLAMA_HOST", value = "127.0.0.1:${listen_port}", locked = true },
  { name = "OLLAMA_MODELS", value = "${field.models_dir}", when = "not field.use_default_store" },
  { name = "OLLAMA_KEEP_ALIVE", value = "-1" },
  { name = "OLLAMA_MAX_LOADED_MODELS", value = "1" },
  { name = "OLLAMA_NO_CLOUD", value = "1", locked = true },     # without it a plain serve calls ollama.com at start-up and every ~4 h (A6)
  # Isolation (the person's rule: the engines are isolated from each other completely). What Ollama keeps that is not its models
  # (its identity, a key pair it makes at its first start in `~/.ollama`, and the shader caches of the graphics driver in
  # `~/.cache`: O29) is kept in a home and a temporary folder of its own below its root, and not in the person's. Except when the
  # person asked for Ollama's own store: that is the home of the Ollama they run themselves, and is left as it is.
  { name = "HOME", value = "${data}/ollama/home", when = "not field.use_default_store" },
  { name = "USERPROFILE", value = "${data}/ollama/home", when = "not field.use_default_store" },
  { name = "TMPDIR", value = "${data}/ollama/cache/tmp" },
  { name = "TEMP", value = "${data}/ollama/cache/tmp" },
  { name = "TMP", value = "${data}/ollama/cache/tmp" },
]
mkdir = ["${data}/ollama/home", "${data}/ollama/cache/tmp"]
group = true                    # own process group (Unix) or job object (Windows): the runners are children
stop = { policy = "graceful", grace = "10s", exit_grace = "2s" }

[launch.ready]
probe = { use = "http", path = "/api/version", expect = 200 }
timeout = "120s"
interval = "500ms"

[[launch.warm]]                 # after ready, only when a model is selected (otherwise: management mode)
when = "model"
call = { method = "POST", path = "/api/generate", body = { model = "${model.id}", keep_alive = -1 }, timeout = "600s" }     # no num_ctx: the next request without one would reload the model at the default (A7)

[[launch.unload]]
when = "model"
call = { method = "POST", path = "/api/generate", body = { model = "${model.id}", keep_alive = 0 }, timeout = "5s", best_effort = true }

# ---- settings form ---------------------------------------------------------------------------------------
[[field]]
id = "mode"
label = "When Ollama is already running"
type = "choice"
options = ["auto", "attach", "spawn"]
default = "auto"
help = "auto: use the Ollama that answers on this port, otherwise start one. attach: never start one. spawn: always start our own."
enabled_when = "not session.running"
ui = { section = "advanced", order = 1 }

[[field]]
id = "port"
label = "Port"
type = "port"
default = 11434
bind.port = "public"
enabled_when = "not session.running"
ui = { section = "primary", order = 10 }

[[field]]
id = "ctx_size"
label = "Context size"
type = "int"
range = [256, 131072]
step = 64
optional = true                 # no default: Ollama's own is tiered by the VRAM it can see (O12), which QuickAI cannot, so a number made up from RAM would only override something better informed
bind.env = [ { name = "OLLAMA_CONTEXT_LENGTH", value = "${value}" } ]
applies = "spawn_only"          # an attached daemon's environment belongs to its owner, and a per-request num_ctx does not stick (A7)
enabled_when = "not session.running"
ui = { section = "primary", order = 20, hint = "Ollama's own default" }

[[field]]
id = "gpu"
label = "GPU"
type = "choice"
options = ["auto", "off"]
default = "auto"
bind.env = [
  { name = "OLLAMA_VULKAN", value = "0", when = "value == 'off'" },
  { name = "CUDA_VISIBLE_DEVICES", value = "-1", when = "value == 'off'" },
  { name = "ROCR_VISIBLE_DEVICES", value = "-1", when = "value == 'off'" },
]
derive = { gpu_offload = "value != 'off'" }
applies = "spawn_only"
enabled_when = "not session.running"
ui = { section = "primary", order = 30 }

[[field]]
id = "models_dir"
label = "Model store"
type = "dir"
default = "${data}/ollama/models"
applies = "spawn_only"           # an attached daemon's environment belongs to its owner
enabled_when = "not session.running"
ui = { section = "advanced", order = 10 }

[[field]]
id = "use_default_store"
label = "Use Ollama's own model store instead"
type = "bool"
default = false
applies = "spawn_only"           # an attached daemon's environment belongs to its owner
enabled_when = "not session.running"
share = "review"
share_note = "Uses the model store of the Ollama you run yourself instead of QuickAI's own: its models are the ones in that store."
ui = { section = "advanced", order = 11 }

[[field]]
id = "extra_env"
label = "Extra environment (KEY=VALUE per line)"
type = "kv_lines"
default = ""
bind.env_lines = { protect = ["OLLAMA_HOST", "OLLAMA_MODELS", "OLLAMA_NO_CLOUD", "HOME", "USERPROFILE", "TMPDIR", "TEMP", "TMP"] }
applies = "spawn_only"           # an attached daemon's environment belongs to its owner
enabled_when = "not session.running"
share_note = "Lines of environment, set for Ollama as they are written."
ui = { section = "advanced", order = 90 }

[[field]]
id = "bin_override"
label = "ollama binary"
type = "runtime_path"
ui = { section = "advanced", widget = "runtime_manager", order = 2 }

# The model that was selected when the application last saved: the window selects it again.
[[field]]
id = "last_model"
type = "hidden"

# ---- models: listed, pulled and removed over HTTP -------------------------------------------------------
[models]
needs_server = true             # these calls need a daemon, so management mode may start one
list = { call = { method = "GET", path = "/api/tags" }, items = "/models", map = { id = "/name", display = "/name", size_bytes = "/size", digest = "/digest", capabilities = "/capabilities" }, cache = "${data}/ollama/catalog-cache.json", hide = ["llamacpp:.*"] }     # v0.35.1 lists each model's capabilities here (recorded), so no /api/show per model. v0.40.0 lists a model that is kept in two forms twice and adds its own `llamacpp:<digest>` copy (recorded 2026-10-10 for qwen3-vl:8b): the copy is bookkeeping, not a model to pick, and the duplicate name is folded
pull = { call = { method = "POST", path = "/api/pull", body = { model = "${ref}" }, stream = "ndjson" }, progress = { key = "/digest", completed = "/completed", total = "/total", status = "/status" } }
remove = { call = { method = "DELETE", path = "/api/delete", body = { model = "${ref}" } } }
capabilities = { call = { method = "POST", path = "/api/show", body = { model = "${ref}" } }, pointer = "/capabilities" }   # discovered modalities: "vision" and so on
# first match wins (docs/phase3-test-plan.md, M01). What "Look up online" fills the list from is `[[models.lookup]]` below, not a rule here
input_rules = [
  { when = 'matches(input, "^hf\.co/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(:[A-Za-z0-9._-]+)?$")', do = "pull", ref = "${input}" },
  { when = 'matches(input, "^https://huggingface\.co/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/?$")', do = "pull", ref = "hf.co/${path_after_host(input)}" },
  { when = 'starts_with(input, "https://huggingface.co/")', do = "reject", message = "Paste the model's page (huggingface.co/user/repo), not a link to a file." },
  { when = "is_url(input)", do = "reject", message = "Ollama pulls by name. Use an hf.co/... reference, or switch the engine to llama.cpp." },
  { when = "is_file(input)", do = "reject", message = "Importing a local file is not supported for Ollama yet." },
  { when = 'matches(input, "^[a-z0-9._/-]+(:[A-Za-z0-9._-]+)?$")', do = "pull", ref = "${input}" },
  { do = "reject", message = "That does not look like a model name. Try qwen3:4b or hf.co/user/repo:Q4_K_M." },
]

# "Look up online": the library of models at ollama.com. It has no list a program can read, so the page of its own
# search is read, local models only, and the library's own models (a person's uploads are left out). It is
# QuickAI that asks, not the daemon, and only when the button is pressed, so this host is not in `egress` above
# (that is what the daemon contacts); `site` is where a mirror, or a test, would point it
[[models.lookup]]
id = "library"
use = "ollama_library"
site = "https://ollama.com"

[traffic]
apis = ["openai.chat", "openai.completions", "ollama.chat", "ollama.generate"]

[api_info]
base_url = "http://127.0.0.1:${public_port}/v1"
extra_urls = [ { label = "Ollama API", url = "http://127.0.0.1:${public_port}" } ]
api_key = { value = "none", note = "Ollama doesn't require one." }
model = { value = "${session.model_display}", note = "Use exactly this name: a request that names another model loads that one instead and unloads this one." }
example = "openai.chat"

[[diagnostic]]
when = { log_matches = 'address already in use' }
hint = "Another program is using port ${field.port}. Pick another port."
action = "focus_field:port"

[[diagnostic]]
when = { log_matches = '(?i)requires more system memory' }
hint = "The model does not fit in memory. Pick a smaller model or a smaller context size."

[[diagnostic]]
when = { log_matches = '(?i)no (compatible|usable) gpus?' }
hint = "Ollama found no usable GPU and will run on the CPU. On Linux, AMD and Intel GPUs need Vulkan drivers (Mesa) installed."
