# llama.cpp as a document: how QuickAI finds, starts and talks to llama-server
# (docs/architecture.md, section 6.1).
#
# This is what the application ships and what its behaviour comes from; a document of the same id in
# the user's configuration directory patches it (docs/architecture.md, section 5.2). This version
# interprets the sections below. The rest of the design (runtime, models, components, traffic,
# api_info, diagnostics) is in docs/examples/engines/llamacpp.toml and joins this file as the phases
# of docs/implementation-plan.md bring them to life.
schema = 1
kind = "engine"
id = "llamacpp"
requires = { primitives = ["locate.setting@1", "locate.next_to_exe@1", "locate.dev_tree@1", "spawn@1", "probe.http@1", "feed.github_release@1", "install.archive@1", "lookup.huggingface_gguf@1"] }

[engine]
name = "llama.cpp"
server_name = "llama-server"
summary = "One llama-server process serves one GGUF model."
license = "MIT"
bundled = true
homepage = "https://github.com/ggml-org/llama.cpp"
egress = []                     # QuickAI never passes -hf or --model-url, so the server itself contacts no host
order = 10                      # the selector shows llama.cpp first: it is what the application is for

[provides]
apis = ["openai.chat", "openai.completions", "llamacpp.completion", "openai.embeddings"]
web_ui = { path = "/", label = "Open Chat UI" }
accepts = { formats = ["gguf"] }                  # models are files of this format (a catalog is held to it)
model_name_matters = false
default_port = 8080

# Where the binary is. No network; the first strategy that yields a path wins. File names get the
# platform's executable suffix (.exe on Windows) on their own.
[locate]
strategies = [
  { use = "setting", field = "bin_override" },
  { use = "next_to_exe", file = "llama-server" },
  { use = "dev_tree", path = "llama.cpp/build/bin/llama-server" },
]

[launch]
strategies = ["spawn"]

[launch.spawn]
program = "${runtime.binary}"
# The fields below append their own arguments after these, in their `order`; `extra_args` is last.
args = ["--model", "${model.main.path}", "--host", "127.0.0.1", "--port", "${listen_port}"]
# llama-server's RUNPATH points at the directory it was built in; a package keeps its shared
# libraries beside the binary, so the loader is pointed there.
env = [ { name = "LD_LIBRARY_PATH", prepend = "${runtime.dir}", sep = ":" } ]
group = false
stop = { policy = "kill" }

[launch.ready]
probe = { use = "http", path = "/health", expect = 200 }
timeout = "120s"
interval = "500ms"
# a big model on a slow disk can take longer: say so and go on waiting, as it always has (the default,
# `fail`, gives up on a program that never answers and stops it)
on_timeout = "wait"

# ---- builds ----------------------------------------------------------------------------------------
# What the runtime manager in Settings works from: the list of builds (llama.cpp's own GitHub
# releases), which file of a release is for this machine, how an archive becomes an installed build
# and where those are kept.

[acquire]
root = "${data}/llama-bin"
# Every CI build is a GitHub prerelease: there is no separate stable release with binaries attached.
feed = { use = "github_release", repo = "ggml-org/llama.cpp", per_page = 10, show = 5, prereleases = true }
# offered first, and what "Install llama.cpp" takes: the release the packages ship (build/config.env of quickai_base),
# the first that runs Bonsai 2's ternary weights (Q2_0 with the Hadamard runtime, llama.cpp #29600)
tested = { tag = "b11889" }
# A `cudart-*` file is the CUDA runtime alone, with no llama-server inside it.
assets = { by = "keywords", ext = [".zip", ".tar.gz"], exclude = ["cudart"], os = { windows = ["win"], macos = ["macos", "osx"], linux = ["ubuntu", "linux"] }, arch = { x86_64 = ["x64", "x86_64", "amd64"], aarch64 = ["arm64", "aarch64"] }, label = "${tag}-${stem}" }
install = { use = "archive", binary = { name = "llama-server", search_depth = 4 }, chmod = true }
filter_hint = "e.g. vulkan, rocm, b110..."
backends = [
  { match = "cuda", label = "CUDA", needs_gpu = "nvidia" },
  { match = "vulkan", label = "Vulkan" },
  { match = "sycl", label = "SYCL" },
  { match = "hip", label = "ROCm/HIP", needs_gpu = "amd" },
  { match = "rocm", label = "ROCm/HIP", needs_gpu = "amd" },
  { match = "cpu", label = "CPU" },
]

# ---- models: how they are looked up online, and what goes with them -------------------------------------
# "Look up online" and the Search button of the model box read the GGUF repositories of Hugging Face
# (docs/lookup-and-bundles.md). The window sorts what is found by the types and sizes of the vocabulary and
# draws it as Ollama's look-up is drawn. Nothing is asked until a button is pressed.
[[models.lookup]]
id = "hub"
use = "huggingface_gguf"
site = "https://huggingface.co"
popular = 30                    # repositories looked into for the plain list
keyword = 20                    # ... for the words typed
similar = 20                    # ... for each single word of a phrase typed, to find what the phrase misses
prefer = ["Q4_K_M", "Q4_K_S", "Q5_K_M", "Q4_0", "Q8_0", "Q6_K", "Q3_K_M"]      # the quantizations to offer first
skip = ["*-?????-of-?????*", "mtp/*", "mtp-*", "imatrix*"]     # patterns: shards, draft models and importance matrices are not weights
show_variants = 4               # buttons a model gets
types = ["chat", "reasoning", "code", "translation", "vision", "documents", "embedding"]     # what llama-server runs; the rest is shown as Other

# What is fetched together with the weights of a model, as one download. A vision model needs its projector,
# a second file that turns pictures into what the model reads; a repository that has one is offered in a
# second row. A bundle names a kind of component, and `[components.<kind>]` says how llama-server is told.
[[models.bundle]]
id = "vision"
label = "with projector"
help = "A vision model reads pictures through a second file, its projector. Both are fetched, and the projector is attached when the model starts."
parts = [
  { kind = "mmproj", label = "projector", match = ["mmproj*.gguf", "*mmproj*.gguf"], prefer = ["F16", "BF16", "Q8_0", "F32"] },
]

[components.mmproj]
bind.arg = ["--mmproj", "${component.path}"]

# How llama-server is started for a kind of model. A catalog (data) names a mode by its id and a record
# beside the weights remembers it; the words are the engine's own, and they come after the arguments of the
# fields and before the person's extra ones. Without the flag the server is up and answers 501 to the
# calls these models are for.
[[models.mode]]
id = "embedding"
label = "embedding server"
help = "llama-server answers /v1/embeddings only when it is started with --embeddings."
arg = ["--embeddings"]

[[models.mode]]
id = "rerank"
label = "reranker"
help = "llama-server answers /v1/rerank only when it is started with --reranking."
arg = ["--reranking"]

# A chat model that thinks before every answer unless told not to (Bonsai 2, made from Qwen3.5): a short question is
# otherwise thousands of tokens of thought before the first word of the answer, minutes on a laptop's processor. It is
# started with thinking off and the sampling its makers give for that.
[[models.mode]]
id = "direct"
label = "assistant that answers without thinking first"
help = "llama-server is started with --reasoning off and the sampling the model's makers recommend without thinking (temperature 0.7, top-p 0.8, top-k 20, presence penalty 1.5)."
arg = ["--reasoning", "off", "--temp", "0.7", "--top-p", "0.8", "--top-k", "20", "--min-p", "0", "--presence-penalty", "1.5"]

# ---- what the API panel says ---------------------------------------------------------------------------
# The texts are the ones the window always had, word for word (the curl example is the vocabulary's).
[api_info]
base_url = "http://127.0.0.1:${public_port}/v1"
api_key = { value = "none", note = "llama.cpp doesn't require one by default — leave it blank, or use any placeholder value if your client insists on a non-empty string." }
model = { value = "${session.model_display}", note = "Only one model is ever loaded at a time, so most OpenAI-compatible clients work with any value here." }
example = "openai.chat"

# What the log of a start that failed says, and what to do about it (UI v2): the crash panel shows these in place of
# its advice about builds when one matches.
[[diagnostic]]
when = { log_matches = "(?i)(couldn't bind|address already in use)" }
hint = "Another program is using port ${field.port}. Pick another port under Change, Custom."
action = "focus_field:port"

[[diagnostic]]
when = { log_matches = "(?i)unknown model architecture" }
hint = "This llama.cpp build is older than the model. Choose a newer build in Settings, Advanced."
action = "open:settings"

[[diagnostic]]
when = { log_matches = "(?i)invalid magic characters" }
hint = "The model's file is not a whole GGUF model (a download that broke off, or another kind of file). Get it again, or choose another model."

[[diagnostic]]
when = { log_matches = "(?i)(failed to allocate|out of memory|cudamalloc failed)" }
hint = "The model does not fit in memory. Choose Light under Change, fewer GPU layers, or a smaller model."
action = "focus_field:ctx_size"

# ---- settings -------------------------------------------------------------------------------------
# `legacy_key` is the name the value has always had in settings.json. Labels and help are the texts
# the window has always shown, word for word (a test compares them with the golden file). The window
# adds the colon after a label that sits in front of its control.

[[field]]
id = "port"
label = "Port"
help = '''TCP port llama-server listens on, on this machine only (127.0.0.1) — never exposed to your network. The default 8080 is fine unless something else on your system is already using it; any free port from 1-65535 works.'''
type = "port"
default = 8080
legacy_key = "port"
bind.port = "public"
enabled_when = "not session.running"
ui = { section = "primary", order = 10 }

[[field]]
id = "ctx_size"
label = "Context size"
help = '''Maximum number of tokens (roughly, word-pieces) of conversation llama.cpp keeps in memory at once — prompt plus reply combined. Bigger means it remembers more of a long chat/document, but uses more RAM/VRAM and can respond slower. Typical values: 2048-4096 for short chats, 8192-16384 for longer ones, 32768+ only for large documents on machines with memory to spare.'''
type = "int"
range = [256, 131072]
step = 64
default = { fn = "recommend_ctx_size", args = ["model.size_bytes", "sys.ram_bytes"] }
recompute_on = ["model"]        # picking another model resets the value to the recommendation
legacy_key = "ctx_size"
bind.arg = ["--ctx-size", "${value}"]
enabled_when = "not session.running"
ui = { section = "primary", order = 20 }

[[field]]
id = "n_gpu_layers"
label = "GPU layers"
help = '''How many of the model's layers to run on the GPU instead of the CPU. 999 (default) offloads every layer llama.cpp can — fastest, if the model fits in your GPU's VRAM. 0 = CPU only. If Start crashes or the log shows an out-of-memory error, the model likely doesn't fit in VRAM — try a smaller number (e.g. 20-40) to offload only part of it, or 0 to fall back to CPU entirely.'''
type = "int"
range = [0, 999]
default = 999
legacy_key = "n_gpu_layers"
bind.arg = ["--n-gpu-layers", "${value}"]
derive = { gpu_offload = "value > 0" }
enabled_when = "not session.running"
ui = { section = "primary", order = 30 }

[[field]]
id = "extra_args"
label = "Extra command-line arguments"
help = '''
Appended verbatim to the llama-server command, after the built-in options (port/context size/GPU layers). Space-separated; wrap a value containing spaces in "double quotes". An invalid or unsupported flag will make the server fail to start — check the log pane at the bottom of the main window if Start doesn't work.

Examples:
--threads 8         number of CPU threads to use
--flash-attn on     enable flash attention (faster; needs support)
--batch-size 512    tokens processed per batch
--no-mmap           disable memory-mapping the model file
--rope-freq-base 0  override RoPE frequency base (long-context models)'''
type = "text"
default = ""
legacy_key = "extra_args"
bind.arg_split = true           # a shell-like split with quotes; nothing is added when it is empty
share_note = "Command-line words, passed to llama-server as they are written."
ui = { section = "advanced", order = 90, hint = "e.g. --threads 8 --flash-attn on" }

# Every engine takes lines of environment (C189). llama-server reads most of its options from a variable as well as
# from a flag (L2), and the graphics libraries it is built on read only variables.
[[field]]
id = "extra_env"
label = "Extra environment (KEY=VALUE per line)"
help = '''
Variables for llama-server, one KEY=VALUE per line; a line that starts with # is a comment. Most of its options can be given this way as well as on the command line: LLAMA_ARG_THREADS=8 is --threads 8 (when both are given, the command line wins). The graphics libraries take only variables, e.g. GGML_VK_VISIBLE_DEVICES=0 to use the first GPU alone with a Vulkan build. LD_LIBRARY_PATH is QuickAI's: it points at the build's own libraries.'''
type = "kv_lines"
default = ""
bind.env_lines = { protect = ["LD_LIBRARY_PATH"] }
share_note = "Lines of environment, set for llama-server as they are written."
ui = { section = "advanced", order = 91, hint = "e.g. LLAMA_ARG_THREADS=8" }

[[field]]
id = "bin_override"
label = "llama-server binary"
help = '''Override the auto-detected llama-server executable — point this at a custom build (e.g. a different backend, or a newer version), or paste a direct download URL to a release archive (.zip/.tar.gz) to fetch and install it automatically. Leave blank to use the bundled/auto-detected one.'''
type = "runtime_path"
legacy_key = "llama_bin_override"
ui = { section = "advanced", widget = "runtime_manager", order = 1, hint = "Local binary path or a download URL..." }

# Where downloaded models are kept. No default: with no value the application uses its own folder,
# worked out afresh on every start (a settings file copied to another machine must not carry a path).
[[field]]
id = "models_dir"
label = "Downloaded models folder"
help = '''Where models fetched via the "Model" box (download/import/search) or "Look up online" are saved and read back from. The models bundled with the app itself live in their own read-only folder regardless of this.'''
type = "dir"
legacy_key = "models_dir_override"
ui = { section = "app", order = 1 }

# The model that was selected when the application last saved.
[[field]]
id = "last_model"
type = "hidden"
legacy_key = "last_model_filename"
