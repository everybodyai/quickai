# The Default configuration (docs/configurations.md, section 3): the engine in use (llama.cpp on a first run; the window
# reads this one as whichever engine is chosen in the toolbar, WP4.26), the model the application chooses, and every
# setting at its default. A person can change it and save it (their file in `profiles/` of their
# configuration directory, with `replace = true`, stands in for this one), and "Reset to factory" removes theirs.
# It names no model and no build: what runs is what the application would run if nothing had been chosen.
schema = 1
kind = "profile"
id = "default"
name = "Default"
engine = "llamacpp"

[meta]
note = "The engine in use, with the model QuickAI chooses and every setting as it is when QuickAI is first started."
