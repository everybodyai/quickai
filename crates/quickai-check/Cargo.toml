[package]
name = "quickai-check"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The check of a configuration shared on quickai.everybodyai.dev, built to WebAssembly for the community's Worker: the app's own reading of the file, its screens for secrets and paths, and the identity that keeps one copy of each, over the documents the app ships."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quickai-core = { path = "../quickai-core" }
include_dir = "0.7.4"
serde_json = "1"
