# What cargo-about reads for generate.py. The order of `accepted` is the order of preference: a library that offers a
# choice is taken under the first of these it offers. A library under anything not listed stops the generator, so a new
# kind of license is something somebody looks at. QuickAI's own crates are here to be recognised; generate.py leaves
# them out.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "PolyForm-Noncommercial-1.0.0",
]

# What the packages are built for: build/common.sh and build/windows.bat for Linux and Windows, build/macos.sh for macOS.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# What only builds or tests the programs is not in what is shipped.
ignore-dev-dependencies = true
ignore-build-dependencies = true
