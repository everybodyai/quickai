[workspace]
resolver = "2"
members = ["crates/quickai", "crates/quickai-core", "crates/quickai-runtime", "crates/quickai-run"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
