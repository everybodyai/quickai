[workspace]
resolver = "2"
members = ["crates/quickai", "crates/quickai-core", "crates/quickai-runtime", "crates/quickai-run"]
# A changed copy of a library, not a part of QuickAI: its code is not checked or tested as ours is
exclude = ["vendor/winit"]

[workspace.package]
version = "0.2.6"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# the function names stay, so that a crash's problem report has a stack trace to fix it by (C202); only the debug
# information goes ("symbols" took the names too, and a released build's stack was `<unknown>` lines)
strip = "debuginfo"

# winit without KDE's blur protocol, which is under the LGPL: see vendor/README.md
[patch.crates-io]
winit = { path = "vendor/winit" }
